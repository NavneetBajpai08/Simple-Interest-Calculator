<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">
        <h1>Simple Interest Calculator</h1>
        <p class="subtitle">Calculate simple interest instantly</p>

        <label for="principal">Principal Amount</label>
        <input type="number" id="principal" placeholder="Enter principal amount">

        <label for="rate">Rate of Interest (%)</label>
        <input type="number" id="rate" placeholder="Enter rate of interest">

        <label for="time">Time Period (Years)</label>
        <input type="number" id="time" placeholder="Enter time period">

        <button onclick="calculateInterest()">Calculate Interest</button>
        <button class="clear-btn" onclick="clearCalculator()">Clear</button>

        <div id="result" class="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
